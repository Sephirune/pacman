[project]
name = "pac-man"
version = "1.0.0"
description = "Pac-Man clone written in Python with pygame (42 project)"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "pygame>=2.5",
    "mazegenerator",
]

[dependency-groups]
dev = [
    "flake8>=7.0",
    "mypy>=1.10",
    "pytest>=8.0",
    "pyinstaller>=6.0",
]

[tool.uv]
package = false

[tool.uv.sources]
# The A-Maze-ing package assigned by another group, used as-is.
mazegenerator = { path = "mazegenerator-2.1.0-py3-none-any.whl" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
